name: Ulab repair proof checks
on:
  push:
    branches:
      - ulab-repair-proof-v1
      - ulab-execution-engine-v1
      - ulab-four-person-pilot
      - ulab-identity-intelligence-v1
      - ulab-universal-identity-graph
      - ulab-first-live-fix
  pull_request:
    paths:
      - "identity-lab/**"
      - ".github/workflows/ulab-repair-proof.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Node runtime
        run: node --version
      - name: Validate browser and server JavaScript syntax
        run: |
          node --check identity-lab/api/verify-repair.js
          node --check identity-lab/lib/repair-proof.mjs
          node --check identity-lab/public/proof-ui.js
          node --check identity-lab/public/app.js
          node --check identity-lab/public/repair-ui.js
          node --check identity-lab/public/pilot-ui.js
          node --check identity-lab/public/pilot-engine.mjs
          node --check identity-lab/lib/identity-intelligence.mjs
          node --check identity-lab/lib/public-profile.mjs
          node --check identity-lab/api/public-identity.js
          node --check identity-lab/public/studio.mjs
          node --check identity-lab/public/identity-graph.mjs
          node --check identity-lab/public/identity-graph-ui.mjs
          node --check identity-lab/public/identity-graph-store.mjs
          node --check identity-lab/api/discover.js
          node --check identity-lab/api/execute-repair.js
          node --check identity-lab/api/repair-plans.js
          node --check identity-lab/lib/github-repair-executor.mjs
      - name: Run public repair verification tests
        run: node --test identity-lab/test-repair-proof.mjs identity-lab/test-repair-execution.mjs identity-lab/test-four-person-pilot.mjs identity-lab/test-identity-intelligence.mjs identity-lab/test-identity-graph.mjs identity-lab/test-public-profile.mjs
