name: Identity Lab pilot smoke tests
on:
  push:
    branches:
      - identity-lab-pilot
      - identity-lab-platform-adapters-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check identity-lab/api/audit.js
          node --check identity-lab/app.js
          node --check identity-lab/public/contributor-engine.mjs
          node --check identity-lab/public/contributor-ui.mjs
      - name: Run auditor smoke tests
        run: node --test identity-lab/test-audit.mjs identity-lab/tests/contributor-engine.test.mjs
