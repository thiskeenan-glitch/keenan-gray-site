name: Identity Lab pilot smoke tests
on:
  push:
    branches:
      - identity-lab-pilot
      - identity-lab-platform-engine-v2
      - identity-lab-platform-adapters-v1
      - identity-lab-case-engine-v1
      - identity-lab-secure-accounts-v1
      - identity-lab-universal-audit-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check identity-lab/api/audit.js
          node --check identity-lab/api/discover.js
          node --check identity-lab/lib/identity-discovery.mjs
          node --check identity-lab/app.js
          node --check identity-lab/public/contributor-engine.mjs
          node --check identity-lab/public/contributor-ui.mjs
          node --check identity-lab/public/identity-engine.mjs
          node --check identity-lab/public/operations.mjs
          node --check identity-lab/public/case-engine.mjs
          node --check identity-lab/public/account.mjs
          node --check identity-lab/public/account-model.mjs
          node --check identity-lab/api/identity-config.js
      - name: Run auditor smoke tests
        run: node --test identity-lab/test-audit.mjs identity-lab/tests/contributor-engine.test.mjs identity-lab/tests/identity-engine.test.mjs identity-lab/tests/case-engine.test.mjs identity-lab/tests/account-model.test.mjs identity-lab/tests/discovery.test.mjs
